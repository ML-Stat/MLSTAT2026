baseurl = "https://ml-stat.github.io/MLSTAT2026/"
languageCode = "en-us"
title = "MLSTAT 2026"
theme = "hugo-material-banner"
metadataformat = "yaml"
canonifyurls = true
buildFuture = true
# Enable Google Analytics by entering your tracking id
googleAnalytics = ""
disableKinds = ["taxonomy"]

[markup.goldmark.renderer]
unsafe = true

[params]
	description = "The 4th Conference on Machine Learning and Statistics"

	logo = "images/logo-AA.jpg"
	favicon = "images/logo-AA.jpg"
	banner_image = "images/swufe.jpg"

	# Custom assets
	custom_css = ["css/custom.css"]
	custom_js  = ["js/api.js", "js/app.js", "js/admin.js"]

	# Syntax highlighting theme
	highlight_css  = ""

  [params.palette]
  	primary = "indigo"
  	accent  = "red"

  [params.font]
  	text = "sans-serif"
  	code = "sans-serif Mono"


[params.social]
	github  = "orgs/ML-Stat/repositories"
	email   = "mlstat2026@126.com"

[[menu.main]]
	name   = "Overview"
	url    = "overview"
	weight = 10

[[menu.main]]
	name   = "Registration"
	url    = "register"
	weight = 20

[[menu.main]]
	name   = "Committee"
	url    = "committee"
	weight = 40

[[menu.main]]
	name   = "Schedule"
	url    = "schedule"
	weight = 160
